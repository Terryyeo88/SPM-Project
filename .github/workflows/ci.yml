name: CI

on:
  push:
  pull_request:

jobs:
  # Kept as `test` (its original name) rather than renamed to
  # `backend-test` -- a rename risks silently breaking a GitHub branch
  # protection rule that requires a status check by this exact name, and
  # that couldn't be confirmed one way or the other from here (no access
  # to check branch protection settings). Adding the new job below,
  # untouched otherwise, avoids that risk entirely.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Pinned to 3.13 to match the version this backend was developed
      # and tested against (3.13.3, confirmed via `python --version` in
      # the dev venv) -- not the newest available, the one actually used.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # No .env exists in a fresh checkout -- it's gitignored and never
      # committed -- so SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are
      # genuinely unset here, the same condition verified locally by
      # temporarily removing .env. This is NOT simulated by unsetting
      # env vars in this workflow; it's the real, unavoidable state of a
      # checkout that never had the file. The integration tests skip
      # themselves (see backend/tests/conftest.py); nothing here needs to
      # know which tests those are.
      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing

  # New job -- ci.yml previously never ran anything under frontend/ at
  # all, so the 95 Vitest tests added alongside the IS-27 frontend work
  # (role-based nav/routing, idle/expired-session handling) had nothing
  # checking them on push/PR until this job existed.
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # frontend/package.json's own "engines" field requires
      # ^22.18.0 || >=24.12.0 -- Node 22 (the lower of those two
      # ranges) is used here as an LTS release, matching how the
      # backend job pins to the Python version actually developed
      # against rather than "whatever's newest".
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Confirms the app actually bundles -- catches broken imports
      # (e.g. an unresolved module) that unit tests alone wouldn't
      # necessarily exercise. No .env is present in a fresh checkout
      # here either; Vite's client env vars are simply undefined at
      # build time (nothing throws until a page actually runs in a
      # browser and tries to use them -- see supabaseClient.js), so
      # this step doesn't need Supabase credentials to succeed.
      - name: Build
        run: npm run build

      # `npm test` runs `vitest run` (see package.json) -- unit and
      # integration-style tests that mock Supabase/fetch rather than
      # needing a live backend or database, so no secrets are needed
      # here either.
      - name: Test
        run: npm test

  # A job-level `if:` can't reliably reference `secrets` directly (GitHub
  # Actions' own ambiguity around whether that's available depending on
  # how the workflow is invoked), so the standard, universally-supported
  # pattern is this tiny job: it runs unconditionally, decides in a step
  # (where `secrets` IS always available), and e2e-test below gates on
  # its output instead.
  check-e2e-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: echo "configured=${{ secrets.E2E_SUPABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

  # frontend/e2e/*.spec.js (Playwright) drives a real browser against a
  # real Flask server against a real Supabase project -- unlike the two
  # jobs above, it genuinely needs live credentials, the same way the
  # backend's own integration tests do (backend/tests/conftest.py). This
  # repo currently has no E2E_* secrets configured, so this job is gated
  # on E2E_SUPABASE_URL existing and SKIPS CLEANLY (not a failure) when it
  # doesn't -- same "skip without infra, don't fake it" stance the backend
  # integration-test job already takes. Add the three E2E_* secrets below
  # (repo Settings -> Secrets and variables -> Actions) to turn this on.
  e2e-test:
    needs: check-e2e-secrets
    runs-on: ubuntu-latest
    if: needs.check-e2e-secrets.outputs.configured == 'true'
    env:
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: http://127.0.0.1:5000
      # The E2E_* secrets must be a dedicated test project (the shared one
      # is refused regardless -- frontend/e2e/support/env.js).
      E2E_WRITE_TO_REMOTE_SUPABASE: yes-write-test-data-to-a-dedicated-test-project
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Idempotent (seed.py's own docstring: "looks up existing rows by
      # email/name before creating"), so re-running it against the same
      # project on every CI run is safe -- it won't duplicate accounts.
      - name: Seed test accounts
        working-directory: backend
        run: python seed.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Playwright's own browser binaries aren't npm packages -- cached
      # separately, keyed on the exact @playwright/test version so a
      # version bump invalidates the cache instead of silently running
      # stale browsers against a newer test runner.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit skips the full `install --with-deps`, which also
      # covers Chromium's OS-level shared libraries -- installed here on
      # every run regardless, since those live outside the cached path
      # and a fresh runner image won't have them either way.
      - name: Install Playwright OS dependencies
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
